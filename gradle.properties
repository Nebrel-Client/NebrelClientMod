# ---------------------------------------------------------------------------
# Nebrel Client - shared build configuration
#
# Per-Minecraft-version coordinates (minecraft_version, fabric_version,
# loader_version, the Loom plugin version) live in versions/<mc_version>/
# gradle.properties instead of here, because they differ per target. See
# docs/REFERENCE_MAP.md for why 1.21.1 was the original target and
# docs/MULTI_VERSION.md for why/how this repo now targets four 26.x versions.
# ---------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod metadata, shared by every version subproject.
mod_version=26.1.1
maven_group=de.nebrel
archives_base_name=nebrelclient

# Minecraft 26.x requires Java 25 at runtime; every version subproject
# compiles and declares this as its minimum.
java_version=25
