// ---------------------------------------------------------------------------
// Root build script.
//
// This project builds four Minecraft targets (see settings.gradle) as
// separate Fabric Loom subprojects under versions/, all compiling the same
// shared src/main/java. The root itself applies no Loom plugin and declares
// no Minecraft dependency - it only hosts the headless core-verification
// task below, which is intentionally Minecraft-free so it can run on a
// machine with no Fabric/Mojang network access.
// ---------------------------------------------------------------------------

configurations {
    // Only used by `compileCore` below. Gson is already on Minecraft's
    // runtime classpath via Fabric API, so it is deliberately NOT added as a
    // dependency of any version subproject and never shaded into a jar.
    coreDeps
}

repositories {
    mavenCentral()
}

dependencies {
    coreDeps 'com.google.code.gson:gson:2.10.1'
}

// ---------------------------------------------------------------------------
// Headless core verification.
//
// The platform-independent half of Nebrel (settings, config, module registry,
// theme, animation, search) imports no Minecraft classes. This task compiles
// exactly that subset with the plain JDK so it can be checked on machines that
// cannot reach the Fabric/Mojang maven hosts, and independently of which of
// the four Minecraft targets below happens to compile cleanly.
// ---------------------------------------------------------------------------
tasks.register('compileCore', JavaCompile) {
    group = 'verification'
    description = 'Compiles the Minecraft-independent core with the plain JDK.'

    source = fileTree('src/main/java').matching {
        include 'de/nebrel/client/setting/**'
        include 'de/nebrel/client/module/Module.java'
        include 'de/nebrel/client/module/ModuleCategory.java'
        include 'de/nebrel/client/module/ModuleManager.java'
        include 'de/nebrel/client/config/**'
        include 'de/nebrel/client/gui/theme/**'
        include 'de/nebrel/client/render/animation/**'
        include 'de/nebrel/client/hud/HudAnchor.java'
        include 'de/nebrel/client/util/**'
    }
    classpath = configurations.coreDeps
    destinationDirectory = layout.buildDirectory.dir('classes/core')
    // No `java` plugin is applied at the root (see comment above), so this
    // ad-hoc JavaCompile task gets no sourceCompatibility/targetCompatibility
    // convention from anywhere and Gradle's task validation rejects the task
    // without them, even though `options.release` alone would be sufficient.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    options.release = 21
    options.encoding = 'UTF-8'
}
