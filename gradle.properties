# ---------------------------------------------------------------------------
# Nebrel Client - build configuration
#
# Target platform rationale (see docs/REFERENCE_MAP.md):
#   The repository was empty at bootstrap time, so no version could be
#   inherited. 1.21.1 was chosen because it is the Fabric target that the
#   public NoRisk pack configuration (nrc-configs/versions/prod/nrc-1.21.1.json)
#   pins for its stable line, and because its client rendering API
#   (DrawContext + MatrixStack + scissor) is stable and well documented.
# ---------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric platform
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.14
fabric_version=0.115.6+1.21.1

# Mod metadata
mod_version=26.3
maven_group=de.nebrel
archives_base_name=nebrelclient
